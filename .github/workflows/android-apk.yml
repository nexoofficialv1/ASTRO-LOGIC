name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify Git packaging contract
        run: python3 tool/validate_git_packaging.py

      - name: Source-only readiness audit
        run: python3 tool/static_build_readiness_audit.py

      - name: Validate v082 Western modern expansion
        run: python3 tool/validate_v082_western_modern.py

      - name: Verify final release source contract on tags
        if: github.ref_type == 'tag'
        run: >-
          python3 tool/final_release_gate.py
          --require-lock
          --require-full-scope
          --tag "${GITHUB_REF_NAME}"
          --json build/release/android/PREBUILD_RELEASE_GATE.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Generate governed Android runner
        run: dart tool/bootstrap_android_runner.dart

      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            flutter pub get --enforce-lockfile
          elif git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      - name: Capture dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release/android
          flutter pub deps --style=compact > build/release/android/DEPENDENCY_GRAPH.txt
          cp pubspec.lock build/release/android/pubspec.lock

      - name: Analyze source
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee build/release/android/flutter_analyze.log

      - name: Run Flutter tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Linux CI uses the SQLite library already installed on the runner so
          # tests do not depend on downloading sqlite3 release assets. The
          # production pubspec is restored before the Android release build.
          pkg-config --exists sqlite3
          cp pubspec.yaml build/release/android/pubspec.production.yaml
          restore_pubspec() {
            cp build/release/android/pubspec.production.yaml pubspec.yaml
            flutter pub get >/dev/null
          }
          trap restore_pubspec EXIT
          if grep -q '^hooks:' pubspec.yaml; then
            echo 'Unexpected existing hooks block in pubspec.yaml; refusing CI-only mutation.' >&2
            exit 2
          fi
          cat >> pubspec.yaml <<'YAML'

          hooks:
            user_defines:
              sqlite3:
                source: system
          YAML
          flutter pub get
          {
            echo 'CI_TEST_SQLITE_SOURCE=system'
            echo 'PRODUCTION_ANDROID_SQLITE_SOURCE=sqlite3-default-bundled'
            flutter test
          } 2>&1 | tee build/release/android/flutter_test.log

      - name: Verify native astronomical core
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./tool/verify_native_packaging.sh 2>&1 | tee build/release/android/native_verification.log

      - name: Build Android release APK
        id: apk
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/release/android
          : > build/release/android/flutter_build_apk.log
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Android release build attempt ${attempt}/${max_attempts}" | tee -a build/release/android/flutter_build_apk.log
            if flutter build apk --release \
              --dart-define=ASTRO_LOGIC_EPHEMERIS_BACKEND=astronomy-engine \
              2>&1 | tee -a build/release/android/flutter_build_apk.log; then
              exit 0
            fi
            if [[ "$attempt" -lt "$max_attempts" ]]; then
              delay=$((attempt * 15))
              echo "Transient build/download failure; retrying in ${delay}s." | tee -a build/release/android/flutter_build_apk.log
              sleep "$delay"
            fi
          done
          echo 'Android release build exhausted all retry attempts.' | tee -a build/release/android/flutter_build_apk.log
          exit 1

      - name: Package governed Android evidence
        id: package
        continue-on-error: true
        if: >-
          steps.analyze.outcome == 'success' &&
          steps.tests.outcome == 'success' &&
          steps.native.outcome == 'success' &&
          steps.apk.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_args=(--release-tag "${GITHUB_REF_NAME}")
          fi
          python3 tool/package_release_artifact.py \
            --platform android \
            --input-file build/app/outputs/flutter-apk/app-release.apk \
            --output-dir build/release/android/package \
            --analyze-log build/release/android/flutter_analyze.log \
            --test-log build/release/android/flutter_test.log \
            --native-log build/release/android/native_verification.log \
            --dependency-graph build/release/android/DEPENDENCY_GRAPH.txt \
            --lock-file pubspec.lock \
            --source-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            "${tag_args[@]}"

      - name: Upload Android evidence bundle
        if: >-
          steps.analyze.outcome == 'success' &&
          steps.tests.outcome == 'success' &&
          steps.native.outcome == 'success' &&
          steps.apk.outcome == 'success' &&
          steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ASTRO-LOGIC-Android-${{ github.run_number }}
          path: build/release/android/package/**
          retention-days: 30
          if-no-files-found: error

      - name: Record Android CI gate outcomes
        if: always()
        shell: bash
        run: |
          mkdir -p build/release/android
          {
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "native=${{ steps.native.outcome }}"
            echo "apk=${{ steps.apk.outcome }}"
            echo "package=${{ steps.package.outcome }}"
          } | tee build/release/android/CI_GATE_STATUS.txt

      - name: Upload Android CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ASTRO-LOGIC-Android-Diagnostics-${{ github.run_number }}
          path: |
            build/release/android/flutter_analyze.log
            build/release/android/flutter_test.log
            build/release/android/native_verification.log
            build/release/android/flutter_build_apk.log
            build/release/android/DEPENDENCY_GRAPH.txt
            build/release/android/pubspec.lock
            build/release/android/CI_GATE_STATUS.txt
            ASTRO_LOGIC_v082_SOURCE_VALIDATION.json
            BUILD_READINESS_AUDIT.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Enforce Android CI gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          [[ "${{ steps.analyze.outcome }}" == "success" ]] || failures+=(analyze)
          [[ "${{ steps.tests.outcome }}" == "success" ]] || failures+=(tests)
          [[ "${{ steps.native.outcome }}" == "success" ]] || failures+=(native)
          [[ "${{ steps.apk.outcome }}" == "success" ]] || failures+=(apk)
          if [[ "${{ steps.analyze.outcome }}" == "success" &&
                "${{ steps.tests.outcome }}" == "success" &&
                "${{ steps.native.outcome }}" == "success" &&
                "${{ steps.apk.outcome }}" == "success" &&
                "${{ steps.package.outcome }}" != "success" ]]; then
            failures+=(package)
          fi
          if (( ${#failures[@]} > 0 )); then
            printf 'Android CI gate failure(s): %s\n' "${failures[*]}"
            exit 1
          fi
          echo 'All Android CI gates passed.'
